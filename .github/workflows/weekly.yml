name: ETF 周更自动更新

on:
  schedule:
    # 北京时间 每周六 09:00 = UTC 每周六 01:00
    - cron: '0 1 * * 6'
  # 允许在 Actions 页面手动点一次「Run workflow」立即运行
  workflow_dispatch:

# 允许工作流把 public/ 推送到 gh-pages 分支
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 恢复增量缓存（断点续传用，跨次累积）
        uses: actions/cache@v4
        with:
          path: cache
          key: etf-cache-${{ github.run_number }}
          restore-keys: |
            etf-cache-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行周更（净值走东方财富，免费无密钥）
        env:
          NAV_SOURCE: eastmoney
        run: python etf_tracker/weekly_update.py

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
